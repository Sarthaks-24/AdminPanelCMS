# Render Blueprint: the API only. The dashboard is a Netlify project (see netlify.toml), so this
# file no longer declares a static site.
# Render dashboard → New → Blueprint → pick this repository. Render asks for every `sync: false`
# value on first creation; DEPLOYMENT.md at the repository root (§6, §8.1) explains each one.

services:
  - type: web
    name: portfolio-api
    runtime: docker
    # Paths from the repository root (no rootDir), so there is no doubt what they resolve against.
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    buildFilter:
      paths:
        - server/**
    # Free instances sleep after 15 idle minutes. The heartbeat workflow can reduce sleeping,
    # but Render free does not guarantee uninterrupted 24/7 availability.
    plan: free
    # Exactly one instance: rate limits, caches and the active-token set live in process memory.
    numInstances: 1
    healthCheckPath: /readyz
    envVars:
      - key: MODE
        value: prod
      # Render's router is the one proxy in front of the container.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # The dashboard (*.netlify.app) and the API (*.onrender.com) are separate sites, so a Lax
      # cookie is never sent with the dashboard's requests and nobody can stay signed in. `none`
      # (always paired with Secure) is what makes the split work. Browsers that block third-party
      # cookies outright, Safari among them, still will not keep the session; putting both behind
      # one domain you own (app.example.com + api.example.com) is the fix, and lets this go back to `lax`.
      - key: SESSION_COOKIE_SAMESITE
        value: none
      # Signup is opened later from the Superadmin panel (the panel's choice wins over this value).
      - key: SIGNUP_MODE
        value: closed
      # Asked on creation: type false. Change it to true in the service's Environment tab once the
      # legal pages are final (DEPLOYMENT.md §12).
      - key: LEGAL_POLICIES_APPROVED
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE_PEPPER
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: RESEND_MAIL_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PRODUCT_NAME
        sync: false
      - key: OPERATOR_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
