# Runs on every push and pull request. Council 2026-10-11, backend A1 / master plan Phase 0 item 3.
# server: npm ci, npm test (vitest + mongodb-memory-server), npm run lint:security
# client: npm ci, npm run lint (oxlint + parity + docs check), npm test, npm run build (+ dist check) with VITE_MODE=prod and example identity, check:launch (non-blocking)
# Actions are pinned to full commit SHAs (tag in the trailing comment); Dependabot (.github/dependabot.yml) bumps them.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (test + lint:security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # mongodb-memory-server downloads a MongoDB binary on first run. Pin the download
      # directory so the cache below always covers it (without this it may land in node_modules/.cache).
      - name: Point mongodb-memory-server at a cacheable directory
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache MongoDB binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - run: npm ci

      - name: Tests (in-memory MongoDB, never a real database)
        run: npm test

      - name: Owner-scope lint
        run: npm run lint:security

  client:
    name: client (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    env:
      # A prod-mode build is what gets deployed. It fails without an https API URL and the site
      # identity, so CI passes example values; the deploy host's build settings carry the real ones.
      # check:launch below reports these example values by design.
      VITE_MODE: prod
      VITE_PROD_API_URL: https://api.example.com
      VITE_SITE_DOMAIN: example.com
      VITE_SITE_OPERATOR: Example Operator
      VITE_SITE_JURISDICTION: Example Jurisdiction
      VITE_SITE_HOSTING_PROVIDER: Example Hosting
      VITE_SITE_BACKUP_PROVIDER: Example Backups
      VITE_SITE_LOG_PROVIDER: Example Logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # check-field-parity (inside `npm run lint`) loads server/models, which need mongoose (CB-04).
      - name: Server runtime deps for the parity check
        working-directory: server
        run: npm ci --omit=dev --ignore-scripts

      - run: npm ci

      # Also runs the public-docs check: every doc link resolves, no /v1/v1, no HTML comments.
      - run: npm run lint

      # Component tests in jsdom (vitest + Testing Library), e.g. Enter in a content form keeps visibility.
      - run: npm test

      # `build` ends with scripts/check-dist.mjs: no template token left, the CSP (_headers and the
      # <meta>) allows the API origin and the inline theme script, SPA fallback without 404.html,
      # security.txt, and no operator runbook text is bundled.
      - run: npm run build

      # Launch gate: lists the owner placeholders and example identity values (VITE_SITE_*, the API
      # URL, [Operator legal name] in README/SECURITY/docs, …) still on the public site. They are expected until the owner supplies the facts, so this step reports
      # without failing the job. Make it blocking (drop continue-on-error) before the first invite.
      - name: Owner placeholders (non-blocking until launch)
        run: npm run check:launch
        continue-on-error: true
